# Trading Strategy Parameters
# These control how the bot makes trading decisions

strategy:
  # Timeframe for analysis (e.g., 1h, 4h, 1d)
  timeframe: "1h"

  # Minimum confidence level required to generate a trade signal
  # Higher values = fewer but higher quality trades
  # Range: 0.0 to 1.0
  signal_threshold: 0.65

  # How often to check for new trading opportunities (in seconds)
  # 300 seconds = 5 minutes
  check_interval_seconds: 300

position_management:
  # Base position size as percentage of available capital
  # Example: 0.10 = 10% of capital per trade
  base_position_size_pct: 0.10

  # Maximum number of positions to hold simultaneously
  # Prevents over-concentration in the market
  max_concurrent_positions: 3
