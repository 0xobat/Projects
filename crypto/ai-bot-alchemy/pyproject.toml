[project]
name = "ai-bot-alchemy"
version = "0.1.0"
description = "AI-powered cryptocurrency trading bot with ML predictions and risk management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Blockchain & APIs
    "alchemy-sdk-py>=0.2.0",
    "web3>=6.0.0",
    "websockets>=12.0",

    # Data processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",

    # Machine Learning
    "scikit-learn>=1.3.0",

    # Configuration
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",

    # Web requests
    "requests>=2.31.0",
    "aiohttp>=3.9.0",

    # Database
    "sqlalchemy>=2.0.0",

    # Visualization
    "matplotlib>=3.7.0",
    "plotly>=5.18.0",

    # Utilities
    "click>=8.1.0",
    "loguru>=0.7.0",
    "tenacity>=8.2.0",

    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
